name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm install

      - name: Build Next.js (static export)
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: prevoya.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: prevoya
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: prevoya.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "318851644585"
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:318851644585:web:c9fb84b9235d611c3f3db8
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: G-M632N6E4X7
        run: npm run build

      - name: Install functions dependencies
        working-directory: functions
        run: npm install --legacy-peer-deps

      - name: Build functions TypeScript
        working-directory: functions
        run: npm run build

      - name: Deploy hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-key.json
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > ${{ runner.temp }}/firebase-key.json
          npx firebase deploy --only hosting

      - name: Deploy functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-key.json
        run: |
          npx firebase deploy --only functions --force
